            border-bottom: 1px solid #eee;
            vertical-align: top;
        }
        th {
            background-color: #f8f9fa;
            color: #2c3e50;
            font-weight: bold;
        }
        tr:hover {
            background-color: #fafafa;
        }
        .video-container iframe {
            width: 240px;
            height: 135px;
            border: none;
            border-radius: 6px;
        }
        details {
            background: #f9f9f9;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            max-width: 900px;
        }
        summary {
            cursor: pointer;
            font-weight: bold;
            color: #3498db;
            outline: none;
            user-select: none;
        }
        summary:hover {

        }

    // 配列のデータを画面表示用にカンマ区切りの文字にする関数
    function formatList(arr) {
        if (!arr || arr.length === 0) return "—";
        return arr.join(", "); // ["A", "B"] を "A, B" に変換
    }

    // 表を描画する関数
    function renderTable(data) {
        const tableBody = document.getElementById("musicTableBody");
        tableBody.innerHTML = ""; 

        data.forEach(song => {
            const row = document.createElement("tr");
            const songLyrics = song.lyrics ? song.lyrics : "サボるなちゃんと書け";
            row.innerHTML = "<td><strong>" + song.title + "</strong></td>" +
                            "<td>" + formatList(song.circles) + "</td>" +
                            "<td>" + formatList(song.composers) + "</td>" +
                            "<td>" + formatList(song.vocals) + "</td>" +
                            "<td>" +
                            "    <div class='lyrics-text'>" + songLyrics + "</div>" +
                            "  </details>" +
                            "</td>" +
                            "<td><div class='video-container'>" + song.embedTag + "</div></td>";

            tableBody.appendChild(row);
        });
    }

    // 検索と並び替えの処理
    function filterAndSort() {
        const searchTerm = document.getElementById("searchInput").value.toLowerCase();
        const sortValue = document.getElementById("sortSelect").value;

        let filteredData = musicData.filter(song => {
            // 配列の中身をすべて1つの文字列にして検索対象にする
            const circleText = song.circles ? song.circles.join(" ").toLowerCase() : "";
            const composerText = song.composers ? song.composers.join(" ").toLowerCase() : "";
            const vocalText = song.vocals ? song.vocals.join(" ").toLowerCase() : "";
            const lyricsText = song.lyrics ? song.lyrics.toLowerCase() : "";
            
            return song.title.toLowerCase().includes(searchTerm) ||
                   circleText.includes(searchTerm) ||
                   composerText.includes(searchTerm) ||
                   vocalText.includes(searchTerm) ||
                   lyricsText.includes(searchTerm);
        });

        // 並び替えの処理（1人目の名前を基準にソート）
        if (sortValue === "title") {
            filteredData.sort((a, b) => a.title.localeCompare(b.title, 'ja'));
        } else if (sortValue === "circle") {
            filteredData.sort((a, b) => {
                const valA = a.circles && a.circles[0] ? a.circles[0] : "";
                const valB = b.circles && b.circles[0] ? b.circles[0] : "";
                return valA.localeCompare(valB, 'ja');
            });
        } else if (sortValue === "composer") {
            filteredData.sort((a, b) => {
                const valA = a.composers && a.composers[0] ? a.composers[0] : "";
                const valB = b.composers && b.composers[0] ? b.composers[0] : "";
                return valA.localeCompare(valB, 'ja');
            });
        } else if (sortValue === "vocal") {
            filteredData.sort((a, b) => {
                const valA = a.vocals && a.vocals[0] ? a.vocals[0] : "";
                const valB = b.vocals && b.vocals[0] ? b.vocals[0] : "";
                return valA.localeCompare(valB, 'ja');
            });
        }

        renderTable(filteredData);
    }

    document.getElementById("searchInput").addEventListener("input", filterAndSort);
    document.getElementById("sortSelect").addEventListener("change", filterAndSort);

    // 初回表示
    renderTable(musicData);
</script>
